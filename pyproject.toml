[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemforge"
version = "0.1.0"
description = "A graphical and programmable workbench for alchemical free-energy calculations and HPC workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yonglan Liu" }
]
keywords = [
    "free-energy",
    "FEP",
    "RBFE",
    "ABFE",
    "molecular-dynamics",
    "computational-chemistry",
    "GROMACS",
    "HPC",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt5>=5.15",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7",
    "pytest-qt>=4",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
alchemforge = "alchemforge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

